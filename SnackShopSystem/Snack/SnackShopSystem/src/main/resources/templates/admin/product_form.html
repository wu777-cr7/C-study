<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="card-header">商品信息</div>
        <div class="card-body">
            <form th:action="@{/admin/products/save}" th:object="${product}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3"><label>名称</label><input th:field="*{name}" class="form-control" required></div>
                <div class="mb-3"><label>分类</label><input th:field="*{category}" class="form-control"></div>
                <div class="mb-3"><label>价格</label><input type="number" step="0.01" th:field="*{price}" class="form-control" required></div>
                <div class="mb-3"><label>库存</label><input type="number" th:field="*{stock}" class="form-control" required></div>
                <div class="mb-3"><label>描述</label><textarea th:field="*{description}" class="form-control"></textarea></div>
                <div class="mb-3"><label>图片URL</label><input th:field="*{imageUrl}" class="form-control"></div>
                <div class="mb-3"><label>状态</label><select th:field="*{status}" class="form-control"><option value="ON">上架</option><option value="OFF">下架</option></select></div>
                <button type="submit" class="btn btn-primary">保存</button>
                <a th:href="@{/admin/products}" class="btn btn-secondary">返回</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
