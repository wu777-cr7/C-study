<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>订单管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">订单管理</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">返回后台</a></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <h3>所有订单</h3>
    <table class="table table-bordered">
        <thead class="table-dark"><tr><th>订单号</th><th>用户ID</th><th>收货人</th><th>总金额</th><th>状态</th><th>下单时间</th></tr></thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderNumber}"></td>
            <td th:text="${order.userId}"></td>
            <td th:text="${order.receiverName} + ' / ' + ${order.receiverPhone}"></td>
            <td th:text="'¥' + ${order.totalAmount}"></td>
            <td th:text="${order.status}"></td>
            <td th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
