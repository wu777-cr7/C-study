<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>商品管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">商品管理</a>
        <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">返回后台</a></li>
        </ul>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between mb-3">
        <h3>商品列表</h3>
        <a th:href="@{/admin/products/add}" class="btn btn-success">+ 新增商品</a>
    </div>
    <table class="table table-bordered">
        <thead class="table-dark"><tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead>
        <tbody>
        <tr th:each="p : ${products}">
            <td th:text="${p.id}"></td>
            <td th:text="${p.name}"></td>
            <td th:text="${p.category}"></td>
            <td th:text="'¥' + ${p.price}"></td>
            <td th:text="${p.stock}"></td>
            <td th:text="${p.status}"></td>
            <td>
                <a th:href="@{/admin/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/admin/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
