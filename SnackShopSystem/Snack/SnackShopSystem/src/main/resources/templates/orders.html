<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>我的订单 - 零食商店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">🍿 零食商店</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">所有商品</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">购物车</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">我的订单</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">退出</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h3>📦 我的订单</h3>
    <div class="card mb-3" th:each="order : ${orders}">
        <div class="card-header">
            订单号：<span th:text="${order.orderNumber}"></span>
            <span class="badge bg-warning" th:if="${order.status == 'PENDING'}">待支付</span>
            <span class="badge bg-success" th:if="${order.status == 'PAID'}">已支付</span>
            <span class="badge bg-secondary" th:if="${order.status == 'CANCELLED'}">已取消</span>
            <span class="float-end">下单时间：<span th:text="${#temporals.format(order.createTime, 'yyyy-MM-dd HH:mm:ss')}"></span></span>
        </div>
        <div class="card-body">
            <p>收货人：<span th:text="${order.receiverName}"></span> <span th:text="${order.receiverPhone}"></span></p>
            <p>地址：<span th:text="${order.receiverAddress}"></span></p>
            <p>总金额：¥<span th:text="${order.totalAmount}"></span></p>
            <div th:if="${order.status == 'PENDING'}">
                <a th:href="@{/payment(orderNumber=${order.orderNumber})}" class="btn btn-sm btn-primary">去支付</a>
                <form th:action="@{/order/cancel}" method="post" style="display:inline">
                    <input type="hidden" name="orderNumber" th:value="${order.orderNumber}">
                    <button type="submit" class="btn btn-sm btn-danger">取消订单</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
