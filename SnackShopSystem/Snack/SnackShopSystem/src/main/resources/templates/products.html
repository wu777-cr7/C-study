<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>商品列表 - 零食商店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">🍿 零食商店</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">所有商品</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">购物车</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">我的订单</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">退出</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h3>🍬 全部零食</h3>
    <div class="row">
        <div class="col-md-3 mb-4" th:each="p : ${products}">
            <div class="card h-100">
                <img th:src="${p.imageUrl != null ? p.imageUrl : 'https://via.placeholder.com/200x150'}" class="card-img-top" alt="商品图片" style="height:150px; object-fit:cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${p.name}"></h5>
                    <p class="card-text text-danger">¥<span th:text="${p.price}"></span></p>
                    <p class="card-text">库存: <span th:text="${p.stock}"></span></p>
                    <form th:action="@{/cart/add}" method="post">
                        <input type="hidden" name="productId" th:value="${p.id}">
                        <input type="number" name="quantity" value="1" min="1" max="10" class="form-control mb-2">
                        <button type="submit" class="btn btn-danger w-100" th:if="${p.stock > 0}">加入购物车</button>
                        <button class="btn btn-secondary w-100" disabled th:if="${p.stock == 0}">已售罄</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
