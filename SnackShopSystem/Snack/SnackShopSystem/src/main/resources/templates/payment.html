<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>支付 - 零食商店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-info text-white">模拟支付</div>
        <div class="card-body">
            <p>订单号：<strong th:text="${orderNumber}"></strong></p>
            <p>请点击确认支付完成订单</p>
            <form th:action="@{/payment/do}" method="post">
                <input type="hidden" name="orderNumber" th:value="${orderNumber}">
                <button type="submit" class="btn btn-primary">确认支付</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
