<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>确认订单 - 零食商店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">🍿 零食商店</a>
    </div>
</nav>
<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-success text-white">填写收货信息</div>
        <div class="card-body">
            <form th:action="@{/checkout/submit}" method="post">
                <div class="mb-3">
                    <label>收货人姓名</label>
                    <input type="text" name="receiverName" class="form-control" th:value="${user.realName}" required>
                </div>
                <div class="mb-3">
                    <label>手机号</label>
                    <input type="text" name="receiverPhone" class="form-control" th:value="${user.phone}" required>
                </div>
                <div class="mb-3">
                    <label>收货地址</label>
                    <input type="text" name="receiverAddress" class="form-control" th:value="${user.address}" required>
                </div>
                <button type="submit" class="btn btn-success">提交订单</button>
                <a th:href="@{/cart}" class="btn btn-secondary">返回购物车</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
