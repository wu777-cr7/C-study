<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta charset="UTF-8">
    <title>购物车 - 零食商店</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand" href="#">🍿 零食商店</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/products}">所有商品</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/cart}">购物车</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/orders}">我的订单</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">退出</a></li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <h3>🛒 我的购物车</h3>
    <table class="table table-bordered">
        <thead class="table-dark">
        <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cartItems}">
            <td th:text="${item.product.name}"></td>
            <td th:text="'¥' + ${item.product.price}"></td>
            <td>
                <form th:action="@{/cart/update}" method="post" style="display:inline">
                    <input type="hidden" name="productId" th:value="${item.product.id}">
                    <input type="number" name="quantity" th:value="${item.cartItem.quantity}" min="0" max="99" style="width:70px">
                    <button type="submit" class="btn btn-sm btn-secondary">更新</button>
                </form>
            </td>
            <td th:text="'¥' + ${item.product.price * item.cartItem.quantity}"></td>
            <td>
                <form th:action="@{/cart/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${item.product.id}">
                    <button type="submit" class="btn btn-sm btn-danger">删除</button>
                </form>
            </td>
        </tr>
        <tr th:if="${cartItems.isEmpty()}">
            <td colspan="5" class="text-center">购物车空空如也，<a th:href="@{/products}">去逛逛</a></td>
        </tr>
        </tbody>
    </table>
    <a th:href="@{/checkout}" class="btn btn-success" th:if="${not cartItems.isEmpty()}">去结算</a>
</div>
</body>
</html>
